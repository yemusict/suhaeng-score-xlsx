<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="학년·학급·평가 영역과 세부항목 배점을 정하면 반별 시트에 합계·평균 수식과 점수 선택 목록이 들어간 엑셀 파일을 만들어 주는 교사용 웹앱">
<meta property="og:title" content="수행평가 점수 입력 엑셀 양식 생성기">
<meta property="og:description" content="반별 시트 · 영역별 합계 · 평균 · 점수 선택 목록까지 한 번에. @yemusict">
<meta property="og:type" content="website">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>수행평가 점수 입력 엑셀 양식 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 한 번에 한 단계만 보이는 4단계 안내 화면. 위는 진행 표시, 아래는 이전/다음 막대 */
:root{
  --bg:#f3f6f4; --paper:#ffffff; --ink:#18241f; --muted:#5d6c65; --line:#d5dfda; --line-strong:#a9bab2;
  --green:#245c49; --green-soft:#e1ede7; --green-tint:#f0f6f3;
  --pen:#c8412b; --pen-soft:#fbe8e3;
  --g1:#245c49; --g1s:#e4f0ea; --g2:#2b4f8a; --g2s:#e5ecf7; --g3:#8a4b1f; --g3s:#f6ebe0;
  /* 평가 영역 열 색: h 머리글, c 점수 칸, sh 소계 머리글, s 소계 칸 (엑셀과 같은 값) */
  --a1h:#dcefe3; --a1c:#f4faf6; --a1sh:#c2e1cd; --a1s:#e6f3ea;
  --a2h:#dce8f7; --a2c:#f4f8fd; --a2sh:#c3d6f0; --a2s:#e5eefa;
  --a3h:#fcefcf; --a3c:#fffbf0; --a3sh:#f6dd9e; --a3s:#fdf3d8;
  --a4h:#eae1f5; --a4c:#f8f5fc; --a4sh:#d7c8ec; --a4s:#f0eaf8;
  --a5h:#d6f0ee; --a5c:#f3fbfa; --a5sh:#b9e2de; --a5s:#e3f5f3;
  --a6h:#f3e4d6; --a6c:#fcf7f2; --a6sh:#e6cbb2; --a6s:#f8ede3;
  --display:"Do Hyeon","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111815; --paper:#18211d; --ink:#e4ece8; --muted:#9aaba3; --line:#2c3933; --line-strong:#465850;
  --green:#7cc4a6; --green-soft:#1f3a30; --green-tint:#1a2a24; --pen:#f08a74; --pen-soft:#3a221d;
  --g1:#7cc4a6; --g1s:#1c3029; --g2:#93b3e8; --g2s:#1b2638; --g3:#e3aa7c; --g3s:#33261a;
  --a1h:#213a2d; --a1c:#18241e; --a1sh:#2c4d3b; --a1s:#1d2e25;
  --a2h:#1f2e45; --a2c:#171f2c; --a2sh:#2a3e5c; --a2s:#1b2638;
  --a3h:#3d3218; --a3c:#241f14; --a3sh:#54441c; --a3s:#2e2817;
  --a4h:#2f2540; --a4c:#1f1a29; --a4sh:#3f3157; --a4s:#271f33;
  --a5h:#173b38; --a5c:#142624; --a5sh:#1f504c; --a5s:#182f2d;
  --a6h:#3b2c1f; --a6c:#251e17; --a6sh:#50392a; --a6s:#2e241b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111815; --paper:#18211d; --ink:#e4ece8; --muted:#9aaba3; --line:#2c3933; --line-strong:#465850;
  --green:#7cc4a6; --green-soft:#1f3a30; --green-tint:#1a2a24; --pen:#f08a74; --pen-soft:#3a221d;
  --g1:#7cc4a6; --g1s:#1c3029; --g2:#93b3e8; --g2s:#1b2638; --g3:#e3aa7c; --g3s:#33261a;
  --a1h:#213a2d; --a1c:#18241e; --a1sh:#2c4d3b; --a1s:#1d2e25;
  --a2h:#1f2e45; --a2c:#171f2c; --a2sh:#2a3e5c; --a2s:#1b2638;
  --a3h:#3d3218; --a3c:#241f14; --a3sh:#54441c; --a3s:#2e2817;
  --a4h:#2f2540; --a4c:#1f1a29; --a4sh:#3f3157; --a4s:#271f33;
  --a5h:#173b38; --a5c:#142624; --a5sh:#1f504c; --a5s:#182f2d;
  --a6h:#3b2c1f; --a6c:#251e17; --a6sh:#50392a; --a6s:#2e241b; color-scheme:dark}
.gc1{--gc:var(--g1);--gcs:var(--g1s)} .gc2{--gc:var(--g2);--gcs:var(--g2s)} .gc3{--gc:var(--g3);--gcs:var(--g3s)}
.ar1{--ah:var(--a1h);--ac:var(--a1c);--ash:var(--a1sh);--as:var(--a1s)}
.ar2{--ah:var(--a2h);--ac:var(--a2c);--ash:var(--a2sh);--as:var(--a2s)}
.ar3{--ah:var(--a3h);--ac:var(--a3c);--ash:var(--a3sh);--as:var(--a3s)}
.ar4{--ah:var(--a4h);--ac:var(--a4c);--ash:var(--a4sh);--as:var(--a4s)}
.ar5{--ah:var(--a5h);--ac:var(--a5c);--ash:var(--a5sh);--as:var(--a5s)}
.ar6{--ah:var(--a6h);--ac:var(--a6c);--ash:var(--a6sh);--as:var(--a6s)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:6px;padding:8px 10px;min-width:0;width:100%;min-height:42px}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--green)}
textarea{font-family:var(--mono);font-size:14px;line-height:1.6;min-height:190px;resize:vertical}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.sp{flex:1}

/* 머리 */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 20px;border-bottom:2px solid var(--ink);padding-bottom:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,3.6vw,34px);line-height:1.15;margin:0;text-wrap:balance}
h1 .mark{color:var(--pen)}
.lead{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line-strong);background:var(--paper);padding:7px 13px;border-radius:6px;font-size:14px;min-height:38px}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn.quiet:hover{color:var(--ink)}

/* 진행 표시 */
.stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.st button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:58px}
.st button:hover{border-color:var(--line-strong)}
.st .n{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:14px;color:var(--muted)}
.st .tx{display:flex;flex-direction:column;min-width:0}
.st .t{font-weight:700;font-size:15px;white-space:nowrap}
.st .t .short{display:none}
.st .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.done .n{border-color:var(--green);color:var(--green)}
.st.warn .n{border-color:var(--pen);color:var(--pen)}
.st.warn .s{color:var(--pen)}
.st button[aria-current="step"]{border:2px solid var(--green);background:var(--green-tint);padding:9px 11px}
.st button[aria-current="step"] .n{background:var(--green);border-color:var(--green);color:var(--paper)}
@media (max-width:720px){.st .s{display:none}.st button{min-height:50px;padding:8px}.st button[aria-current="step"]{padding:7px}.st .t{font-size:13px}}
@media (max-width:480px){.st .t .full{display:none}.st .t .short{display:inline}.st button{flex-direction:column;gap:4px;text-align:center;justify-content:center}.st .t{font-size:12px;white-space:normal;line-height:1.25}.st .n{width:26px;height:26px;font-size:12px}}

/* 단계 화면 */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
@media (max-width:560px){.panel{padding:16px}}
.ph{display:flex;flex-direction:column;gap:2px}
.ph-n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--green);letter-spacing:.06em}
.ph h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.2}
.ph p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;min-width:0}
label.f small{font-weight:400;color:var(--muted)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}

.titlebox{border:1px dashed var(--line-strong);border-radius:8px;padding:16px 18px;background:var(--green-tint);display:flex;flex-direction:column;gap:4px}
.tb-l{font-size:12px;font-weight:700;color:var(--green);letter-spacing:.04em}
.tb-t{font-size:20px;font-weight:700}
.tb-s{font-size:14px;color:var(--muted)}

/* 2단계: 학년과 반 */
.gpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gtog{position:relative;border:2px solid var(--line-strong);background:var(--paper);border-radius:12px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:84px}
.gtog b{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;color:var(--gc)}
.gtog span{font-size:13px;color:var(--muted)}
.gtog::after{content:"";position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:14px;font-weight:700}
.gtog[aria-pressed="true"]{border-color:var(--gc);background:var(--gcs)}
.gtog[aria-pressed="true"]::after{content:"✓";background:var(--gc);border-color:var(--gc);color:var(--paper)}
.gtog:hover{border-color:var(--gc)}
.empty{border:2px dashed var(--line-strong);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}

.gbox{border:2px solid var(--gc);background:var(--gcs);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.gbox-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.badge{font-family:var(--display);font-size:22px;color:var(--paper);background:var(--gc);border-radius:6px;padding:1px 12px;line-height:1.45}
.gbox-h .info{font-size:14px}
.gbox-h .info b{color:var(--gc)}
.counters{display:flex;flex-wrap:wrap;gap:14px 28px}
.counter{display:flex;flex-direction:column;gap:5px}
.counter .cl{font-size:14px;font-weight:600}
.counter .cl small{font-weight:400;color:var(--muted)}
.cwrap{display:flex;align-items:center;gap:8px}
.cbox{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden;background:var(--paper)}
.cbox button{width:42px;min-height:44px;border:0;background:var(--paper);font-size:22px;line-height:1;color:var(--gc)}
.cbox button:hover:not(:disabled){background:var(--gcs)}
.cbox input{width:62px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0;text-align:center;font-size:18px;font-weight:600;min-height:44px}
.cwrap .cu{color:var(--muted);font-size:14px}

.rl{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rl-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.rl-h b{font-size:15px}
.rl-h small{color:var(--muted);font-size:13px}
.cls{display:flex;flex-wrap:wrap;gap:8px}
.cchip{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:6px 12px;display:flex;flex-direction:column;align-items:flex-start;min-width:88px;line-height:1.35}
.cchip b{font-size:15px}
.cchip small{font-size:12px;color:var(--muted)}
.cchip.has small{color:var(--gc);font-weight:700}
.cchip.has small::before{content:"✓ "}
.cchip:hover{border-color:var(--gc)}
.cchip.on{border:2px solid var(--gc);background:var(--gcs);padding:5px 11px}
.redit{border-top:1px dashed var(--line-strong);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.redit-h{display:flex;flex-direction:column;gap:2px}
.redit-h b{font-size:15px}
.redit-h small{font-size:13px;color:var(--muted)}
.redit-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rcount{font-size:13px;color:var(--gc);font-weight:600}
.rcount.none{color:var(--muted);font-weight:400}

/* 3단계: 평가 항목 */
.gtabs{display:flex;flex-wrap:wrap;gap:8px}
.gt{border:2px solid var(--gc);background:var(--paper);color:var(--gc);border-radius:999px;padding:7px 16px;font-weight:700;min-height:42px}
.gt small{font-family:var(--mono);font-weight:500;margin-left:6px}
.gt[aria-selected="true"]{background:var(--gc);color:var(--paper)}
.mix{display:flex;flex-direction:column;gap:6px}
.mix-l{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:10px}
.mix-l b{font-family:var(--mono);font-size:16px;color:var(--gc)}
.mixbar{display:flex;height:40px;border-radius:8px;overflow:hidden;border:1px solid var(--line-strong);background:var(--paper)}
.seg{background:var(--ash);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px;min-width:0;border-right:2px solid var(--paper)}
.seg:last-child{border-right:0}
.seg em{font-style:normal;font-family:var(--mono);font-weight:500;margin-left:5px}
.howto{font-size:14px;background:var(--paper);border-left:4px solid var(--gc);border-radius:4px;padding:10px 14px}
.howto b{color:var(--gc)}
.area{background:var(--paper);border:1px solid var(--line);border-left:10px solid var(--ash);border-radius:10px;overflow:hidden}
.area-h{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;background:var(--ah);padding:10px 12px}
.area-h .ano{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.area-h input{font-weight:700;flex:1 1 160px;max-width:280px}
.area-h .tot{margin-left:auto;font-size:14px;white-space:nowrap}
.area-h .tot b{font-family:var(--mono);font-size:17px}
.xbtn{border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;width:38px;min-height:38px;font-size:15px;line-height:1;color:var(--muted)}
.xbtn:hover:not(:disabled){color:var(--pen);border-color:var(--pen)}
.ihead,.irow{display:grid;grid-template-columns:minmax(0,1.8fr) repeat(3,minmax(58px,.62fr)) 38px;gap:8px;align-items:center;padding:0 12px}
.ihead{padding-top:10px;font-size:12px;font-weight:700;color:var(--muted)}
.irow{padding-block:8px 10px;border-bottom:1px dashed var(--line)}
.irow .ml{display:none}
.ichips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--muted)}
.chip{font-family:var(--mono);font-size:13px;border:1px solid var(--line-strong);border-radius:4px;padding:0 7px;color:var(--ink);background:var(--paper);font-variant-numeric:tabular-nums}
.chip.top{border-color:var(--gc);color:var(--gc);font-weight:700}
.chip.zero{border-style:dashed}
.err{color:var(--pen);font-weight:600}
.area-f{padding:10px 12px}
.addbtn{border:1px dashed var(--line-strong);background:transparent;border-radius:6px;padding:7px 14px;font-size:14px;font-weight:600;color:var(--muted);min-height:38px}
.addbtn:hover{color:var(--ink);border-color:var(--ink)}
.addarea{width:100%;border:2px dashed var(--gc);background:transparent;border-radius:10px;padding:14px;font-weight:700;color:var(--gc);font-size:15px}
.addarea:hover{background:var(--paper)}
.tools{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tools .copy{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.tools .copy select{width:auto}
@media (max-width:620px){
  .ihead{display:none}
  .irow{grid-template-columns:repeat(3,minmax(0,1fr)) 38px}
  .irow .iname{grid-column:1/-1}
  .irow .ml{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:2px}
  .irow .xbtn{align-self:end}
}

/* 4단계: 확인·내려받기 */
.sumrow{display:flex;flex-wrap:wrap;gap:8px}
.stat{font-size:14px;border:1px solid var(--line-strong);border-radius:6px;padding:5px 12px;background:var(--paper)}
.stat b{font-family:var(--mono);color:var(--green)}
.gsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.gs{border-left:6px solid var(--gc);background:var(--gcs);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.gs-h{display:flex;align-items:baseline;gap:8px}
.gs-h b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--gc)}
.gs-h span{font-size:13px;color:var(--muted)}
.gs ul{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:1px}
.gs li{display:flex;gap:6px}
.gs li em{font-style:normal;margin-left:auto;font-family:var(--mono)}
.gs li.t{border-top:1px dashed var(--line-strong);padding-top:3px;margin-top:2px;font-weight:700}
.gs li.t em{color:var(--gc)}
.issues{border:1px solid var(--pen);background:var(--pen-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.issues b{color:var(--pen)}
.issues ul{margin:0;padding-left:18px;font-size:14px}
.pv{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pv-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--green-tint)}
.pg{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.pg-l{font-size:12px;font-weight:700;color:var(--paper);background:var(--gc);border-radius:4px;padding:2px 8px;margin-right:2px}
.ptab{border:1px solid var(--line-strong);background:var(--paper);border-radius:6px;padding:3px 10px;font-size:13px;min-height:32px}
.ptab[aria-selected="true"]{background:var(--gc);border-color:var(--gc);color:var(--paper);font-weight:700}
.pv-bar .check{margin-left:auto}
.sheet{overflow:auto;max-height:520px;background:var(--paper)}
.sheet-title{padding:14px 16px 2px;font-weight:700;font-size:17px}
.sheet-sub{padding:0 16px 10px;font-size:13px;color:var(--muted)}
table.x{border-collapse:collapse;font-size:12.5px;margin:0 16px 12px;font-variant-numeric:tabular-nums}
table.x th,table.x td{border:1px solid var(--line-strong);padding:4px 6px;text-align:center;white-space:nowrap}
table.x thead th{background:var(--green-soft);font-weight:600;position:sticky;top:0}
table.x thead tr:nth-child(2) th{top:29px}
table.x thead tr:nth-child(3) th{top:58px;font-weight:400;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
table.x thead th.ar{background:var(--ah)}
table.x thead th.ar.sum,table.x thead th.ar.top{background:var(--ash)}
table.x td.ar{background:var(--ac)}
table.x td.ar.sum{background:var(--as);font-weight:700}
table.x .total{background:var(--pen-soft);font-weight:700;color:var(--pen)}
table.x thead .total{background:var(--pen-soft)}
table.x td.name{text-align:left;min-width:70px}
table.x td.ph{color:var(--line-strong)}
table.x td.num{font-family:var(--mono)}
table.x tfoot td{background:var(--green-soft);font-weight:700;font-family:var(--mono)}
table.x tfoot td.ar{background:var(--ah)}
table.x tfoot td.ar.sum{background:var(--ash)}
table.x tfoot td:first-child{font-family:var(--body)}
.sig{font-size:11px;color:var(--muted);padding:0 16px 12px;font-family:var(--mono)}
.dl{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.dl-btn{background:var(--green);color:var(--paper);border:0;padding:16px 20px;font-size:18px;font-weight:700;border-radius:10px}
.dl-btn:hover:not(:disabled){filter:brightness(1.08)}
.dl-btn small{display:block;font-size:13px;font-weight:400;opacity:.9;margin-top:2px}
.status{font-size:14px;color:var(--muted);margin:0;min-height:1.4em;text-align:center}
.status.ok{color:var(--green);font-weight:600}
.status.bad{color:var(--pen);font-weight:600}

/* 아래 막대 */
.navbar{position:sticky;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar .pos{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.nav-prev{border:1px solid var(--line-strong);background:var(--paper);border-radius:8px;padding:10px 16px;font-weight:600;min-height:46px}
.nav-next{border:0;background:var(--green);color:var(--paper);border-radius:8px;padding:10px 20px;font-weight:700;font-size:16px;min-height:46px}
.nav-next:hover:not(:disabled){filter:brightness(1.08)}
.nav-hint{font-size:13px;color:var(--pen);font-weight:600}
@media (max-width:480px){.navbar .pos{display:none}.nav-next{flex:1}}
footer.foot{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;padding-bottom:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast button{border:1px solid var(--bg);background:transparent;color:var(--bg);border-radius:6px;padding:5px 12px;font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>수행평가 점수 입력 <span class="mark">엑셀 양식</span> 생성기</h1>
      <p class="lead">네 단계만 따라오면 반별 점수표 엑셀 파일이 완성돼요. 입력한 내용은 이 브라우저에만 저장돼요.</p>
    </div>
    <button type="button" class="btn quiet" data-act="reset">처음부터 다시</button>
  </header>

  <ol class="stepper" id="stepper" aria-label="진행 단계"></ol>
  <main id="view"></main>
  <div class="navbar" id="navbar"></div>
  <footer class="foot">@yemusict</footer>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script>
(function(){
/* ---------- 데이터 ---------- */
const KEY='suhaeng-xlsx-v2', OLD='suhaeng-xlsx-v1', UIKEY='suhaeng-xlsx-ui';
const GN=[1,2,3];
const STARTER=()=>[{name:'영역 1',items:[{name:'세부항목 1',max:10,min:2,step:2}]}];
function defaults(){return {year:new Date().getFullYear(),school:'한빛중학교',subject:'음악',teacher:'',allowZero:false,grades:{
  1:{on:true,classes:4,students:28,rosters:{},areas:[
    {name:'가창',items:[{name:'음정·박자',max:10,min:4,step:2},{name:'발성·표현',max:10,min:4,step:2}]},
    {name:'기악',items:[{name:'리코더 연주',max:20,min:8,step:3}]},
    {name:'감상문',items:[{name:'내용 이해',max:5,min:1,step:1},{name:'느낌 표현',max:5,min:1,step:1}]}]},
  2:{on:true,classes:5,students:27,rosters:{},areas:[
    {name:'합창',items:[{name:'화음 유지',max:15,min:6,step:3},{name:'협동·태도',max:5,min:1,step:1}]},
    {name:'창작',items:[{name:'가락 짓기',max:20,min:8,step:4},{name:'악보 기보',max:10,min:4,step:2}]}]},
  3:{on:false,classes:4,students:28,rosters:{},areas:STARTER()}}}}
function load(){
  let s=null;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(s&&s.grades&&GN.every(n=>s.grades[n]&&Array.isArray(s.grades[n].areas)))return s;
  const d=defaults();let o=null;try{o=JSON.parse(localStorage.getItem(OLD))}catch(e){}
  if(o&&Array.isArray(o.grades)&&o.grades.length){ // 이전 버전 설정 옮겨 오기
    ['year','school','subject','teacher','allowZero'].forEach(k=>{if(o[k]!==undefined)d[k]=o[k]});
    GN.forEach(n=>d.grades[n].on=false);
    o.grades.forEach(g=>{const n=Math.min(3,Math.max(1,+g.grade||1));if(d.grades[n].on)return;
      d.grades[n]={on:true,classes:g.classes,students:g.students,rosters:g.rosters||{},areas:(g.areas&&g.areas.length)?g.areas:STARTER()}});
  }
  return d;
}
let S=load();
let ui={step:1,g:1,open:null,pv:null,sample:true};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UIKEY))||{})}catch(e){}
ui.open=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:NaN};
const r2=v=>Math.round(v*100)/100;
const intIn=(v,lo,hi,d)=>{const n=parseInt(v,10);return isFinite(n)?Math.min(hi,Math.max(lo,n)):d};
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));localStorage.setItem(UIKEY,JSON.stringify({step:ui.step,g:ui.g,pv:ui.pv,sample:ui.sample}))}catch(e){}},200)}

const G=n=>S.grades[n];
const on=()=>GN.filter(n=>G(n).on);
const classes=g=>intIn(g.classes,1,20,1);
const arc=ai=>'ar'+(ai%6+1);
const AP=[ // 엑셀 영역 색 (.ar1~6과 같은 순서)
  {h:'FFDCEFE3',c:'FFF4FAF6',sh:'FFC2E1CD',s:'FFE6F3EA'},{h:'FFDCE8F7',c:'FFF4F8FD',sh:'FFC3D6F0',s:'FFE5EEFA'},
  {h:'FFFCEFCF',c:'FFFFFBF0',sh:'FFF6DD9E',s:'FFFDF3D8'},{h:'FFEAE1F5',c:'FFF8F5FC',sh:'FFD7C8EC',s:'FFF0EAF8'},
  {h:'FFD6F0EE',c:'FFF3FBFA',sh:'FFB9E2DE',s:'FFE3F5F3'},{h:'FFF3E4D6',c:'FFFCF7F2',sh:'FFE6CBB2',s:'FFF8EDE3'}];
const GTAB={1:'FF245C49',2:'FF2B4F8A',3:'FF8A4B1F'};

function scoreList(it){
  const max=num(it.max),min=num(it.min),step=num(it.step);
  if(!isFinite(max)||!isFinite(min)||!isFinite(step))return {err:'최고·최저·급간을 모두 숫자로 입력하세요'};
  if(step<=0)return {err:'급간은 0보다 커야 해요'};
  if(max<min)return {err:'최고 점수가 최저 점수보다 작아요'};
  const a=[];
  for(let v=max;v>=min-1e-9&&a.length<80;v=r2(v-step))a.push(r2(v));
  if(a.length>=80)return {err:'점수 단계가 너무 많아요. 급간을 키워 주세요'};
  if(a[a.length-1]!==r2(min))a.push(r2(min));
  if(S.allowZero&&!a.includes(0))a.push(0);
  return {list:a};
}
function parseRoster(text){
  const out=[];let auto=1;
  String(text||'').split(/\r?\n/).forEach(line=>{
    const t=line.trim();if(!t)return;
    const m=t.match(/^(\d{1,3})\s*[\t ,.)\-]\s*(.+)$/);
    if(m){out.push({no:+m[1],name:m[2].trim()});auto=+m[1]+1}
    else if(/^\d{1,3}$/.test(t)){out.push({no:+t,name:''});auto=+t+1}
    else{out.push({no:auto++,name:t})}
  });
  return out;
}
function students(g,c){
  const r=parseRoster(g.rosters&&g.rosters[c]);
  if(r.length)return r;
  return Array.from({length:intIn(g.students,1,60,25)},(_,i)=>({no:i+1,name:''}));
}
const areaMax=a=>r2(a.items.reduce((s,it)=>s+(num(it.max)||0),0));
const gradeMax=g=>r2(g.areas.reduce((s,a)=>s+areaMax(a),0));
function issues(){
  const out=[];
  on().forEach(n=>G(n).areas.forEach((a,ai)=>a.items.forEach((it,ii)=>{const r=scoreList(it);
    if(r.err)out.push({n,text:`${n}학년 ${a.name||'영역'} › ${it.name||'세부항목'}: ${r.err}`})})));
  return out;
}
const sheetCount=()=>on().reduce((s,n)=>s+classes(G(n)),0);
const kidCount=()=>on().reduce((s,n)=>{let k=0;for(let c=1;c<=classes(G(n));c++)k+=students(G(n),c).length;return s+k},0);

/* ---------- 진행 표시 · 아래 막대 ---------- */
const STEPS=['기본 정보','학년과 반','평가 항목','확인·내려받기'],SHORT=['기본 정보','학년·반','평가 항목','내려받기'];
function stepSub(i){
  if(i===1)return `${esc(S.year)}학년도 ${esc(S.subject||'')}`;
  if(i===2)return on().length?`${on().map(n=>n+'학년').join('·')} · ${sheetCount()}개 반`:'학년을 골라 주세요';
  if(i===3){const k=issues().length;return k?`고칠 곳 ${k}개`:on().map(n=>`${n}학년 ${gradeMax(G(n))}점`).join(' · ')||'—'}
  return `시트 ${sheetCount()}개 · 학생 ${kidCount()}명`;
}
function stepState(i){
  if(i===2&&!on().length)return 'warn';
  if(i===3&&issues().length)return 'warn';
  return i<ui.step?'done':'';
}
function renderStepper(){
  $('stepper').innerHTML=STEPS.map((t,k)=>{const i=k+1,st=stepState(i);
    return `<li class="st ${st}"><button type="button" data-act="go" data-n="${i}" aria-current="${i===ui.step?'step':'false'}">
      <span class="n">${st==='warn'?'!':st==='done'?'✓':i}</span><span class="tx"><span class="t"><span class="full">${t}</span><span class="short">${SHORT[k]}</span></span><span class="s">${stepSub(i)}</span></span></button></li>`}).join('');
}
function renderNav(){
  const s=ui.step;
  const blocked=s===2&&!on().length;
  $('navbar').innerHTML=
    (s>1?`<button type="button" class="nav-prev" data-act="prev">← 이전</button>`:'<span></span>')+
    `<span class="pos">${s} / 4 · ${STEPS[s-1]}</span>`+
    (blocked?`<span class="nav-hint">학년을 하나 이상 골라 주세요</span>`:'')+
    (s<4?`<button type="button" class="nav-next" data-act="next" ${blocked?'disabled':''}>다음: ${STEPS[s]} →</button>`:'');
}
const ph=(n,title,desc)=>`<div class="ph"><span class="ph-n">STEP ${n} / 4</span><h2>${title}</h2><p>${desc}</p></div>`;

/* ---------- 1단계 ---------- */
function view1(){
  return `<section class="panel">
    ${ph(1,'기본 정보','엑셀 시트 맨 위 제목에 들어갈 내용이에요. 처음에는 예시 값이 들어 있으니 우리 학교에 맞게 바꿔 주세요.')}
    <div class="fields">
      <label class="f">학년도<input id="f-year" type="number" inputmode="numeric" data-f="base" data-k="year" value="${esc(S.year)}"></label>
      <label class="f">학교명<input id="f-school" type="text" data-f="base" data-k="school" value="${esc(S.school)}" placeholder="예: 한빛중학교"></label>
      <label class="f">교과<input id="f-subject" type="text" data-f="base" data-k="subject" value="${esc(S.subject)}" placeholder="예: 음악"></label>
      <label class="f">담당 교사 <small>(비워도 돼요)</small><input id="f-teacher" type="text" data-f="base" data-k="teacher" value="${esc(S.teacher)}" placeholder="이름"></label>
    </div>
    <div class="titlebox"><span class="tb-l">엑셀 시트에는 이렇게 들어가요</span><div class="tb-t" id="tb-t"></div><div class="tb-s" id="tb-s"></div></div>
  </section>`;
}
function refresh1(){
  const n=on()[0]||1;
  if($('tb-t'))$('tb-t').textContent=`${S.year}학년도 ${S.subject||''} 수행평가 점수표`.replace(/\s+/g,' ');
  if($('tb-s'))$('tb-s').textContent=[S.school||'학교명',`${n}학년 1반`,S.teacher?`담당 ${S.teacher}`:''].filter(Boolean).join(' · ');
}

/* ---------- 2단계 ---------- */
function counter(n,k,label,hint,unit,lo,hi){
  const g=G(n),v=k==='classes'?classes(g):intIn(g.students,1,60,25);
  return `<div class="counter"><span class="cl">${label}${hint?` <small>${hint}</small>`:''}</span>
    <div class="cwrap"><div class="cbox">
      <button type="button" data-act="inc" data-g="${n}" data-k="${k}" data-d="-1" aria-label="${label} 줄이기" ${v<=lo?'disabled':''}>−</button>
      <input id="g${n}-${k}" type="number" inputmode="numeric" min="${lo}" max="${hi}" aria-label="${n}학년 ${label}" data-f="gnum" data-g="${n}" data-k="${k}" value="${v}">
      <button type="button" data-act="inc" data-g="${n}" data-k="${k}" data-d="1" aria-label="${label} 늘리기" ${v>=hi?'disabled':''}>+</button>
    </div><span class="cu">${unit}</span></div></div>`;
}
function chipText(g,c){const r=parseRoster(g.rosters&&g.rosters[c]);return r.length?`${r.length}명 입력됨`:`빈 칸 ${intIn(g.students,1,60,25)}줄`}
function view2(){
  const list=on();
  return `<section class="panel">
    ${ph(2,'학년과 반','수업 들어가는 학년을 모두 눌러 고르세요. 반마다 엑셀 시트가 하나씩 만들어져요.')}
    <div class="gpick">${GN.map(n=>`<button type="button" class="gtog gc${n}" data-act="tog" data-g="${n}" aria-pressed="${G(n).on}">
      <b>${n}학년</b><span>${G(n).on?`${classes(G(n))}개 반`:'누르면 추가돼요'}</span></button>`).join('')}</div>
    ${list.length?list.map(n=>{const g=G(n);
      return `<div class="gbox gc${n}">
        <div class="gbox-h"><span class="badge">${n}학년</span><span class="info">엑셀 시트 <b id="gsheets-${n}">${classes(g)}개</b>가 만들어져요</span></div>
        <div class="counters">
          ${counter(n,'classes','반 수','','개 반',1,20)}
          ${counter(n,'students','반별 학생 수','(명렬을 안 넣은 반에 쓰여요)','명',1,60)}
        </div>
        <div class="rl">
          <div class="rl-h"><b>학생 명렬</b><small>선택 사항 · 반을 눌러 번호와 이름을 붙여넣으세요. 안 넣으면 번호만 있는 빈 칸으로 만들어져요.</small></div>
          <div class="cls">${Array.from({length:classes(g)},(_,i)=>{const c=i+1,open=ui.open===n+'-'+c,has=parseRoster(g.rosters&&g.rosters[c]).length>0;
            return `<button type="button" class="cchip${open?' on':''}${has?' has':''}" data-act="openRoster" data-g="${n}" data-c="${c}" aria-expanded="${open}"><b>${c}반</b><small id="cls-${n}-${c}">${chipText(g,c)}</small></button>`}).join('')}</div>
          ${rosterEditor(n)}
        </div>
      </div>`}).join(''):`<div class="empty">위에서 학년을 하나 이상 골라 주세요.</div>`}
  </section>`;
}
function rosterEditor(n){
  if(!ui.open||!ui.open.startsWith(n+'-'))return '';
  const c=+ui.open.split('-')[1],g=G(n);if(c>classes(g))return '';
  return `<div class="redit">
    <div class="redit-h"><b>${n}학년 ${c}반 명렬</b><small>나이스나 엑셀에서 <b>번호·이름 두 열</b>을 그대로 복사해 붙여넣으세요. 이름만 한 줄씩 넣어도 번호가 자동으로 붙어요.</small></div>
    <textarea id="roster-${n}-${c}" data-f="roster" data-g="${n}" data-c="${c}" placeholder="1&#9;김하늘&#10;2&#9;박도윤&#10;3&#9;이서연">${esc((g.rosters||{})[c]||'')}</textarea>
    <div class="redit-f"><span class="rcount" id="rcount-${n}-${c}">${rcount(g,c)}</span><span class="sp"></span>
      <button type="button" class="btn" data-act="clearRoster" data-g="${n}" data-c="${c}">비우기</button>
      <button type="button" class="btn" data-act="closeRoster">닫기</button>
      ${c<classes(g)?`<button type="button" class="btn" data-act="openRoster" data-g="${n}" data-c="${c+1}" style="border-color:var(--gc);color:var(--gc);font-weight:700">다음 반 (${c+1}반) →</button>`:''}
    </div></div>`;
}
function rcount(g,c){const r=parseRoster(g.rosters&&g.rosters[c]);if(!r.length)return '아직 비어 있어요';
  const f=r[0],l=r[r.length-1];return `${r.length}명 확인 · ${f.no}번 ${f.name||''} ~ ${l.no}번 ${l.name||''}`}

/* ---------- 3단계 ---------- */
function view3(){
  const list=on();
  if(!list.length)return `<section class="panel">${ph(3,'평가 항목','먼저 학년을 골라 주세요.')}<div class="empty">2단계에서 수업 들어가는 학년을 골라 주세요.<br><br><button type="button" class="btn" data-act="go" data-n="2">학년 고르러 가기</button></div></section>`;
  if(!list.includes(+ui.g))ui.g=list[0];
  const n=+ui.g,g=G(n),others=list.filter(x=>x!==n);
  return `<section class="panel">
    ${ph(3,'평가 항목','학년마다 평가 영역과 세부항목, 점수 범위를 정해요. 영역마다 엑셀 열 색이 달라져요.')}
    ${list.length>1?`<div class="gtabs" role="tablist" aria-label="학년">${list.map(x=>`<button type="button" class="gt gc${x}" role="tab" aria-selected="${x===n}" data-act="gtab" data-g="${x}">${x}학년<small id="gtt-${x}">${gradeMax(G(x))}점</small></button>`).join('')}</div>`:''}
    <div class="gbox gc${n}">

          <div><span class="ml">최저</span><input id="i-${n}-${ai}-${ii}-min" type="number" inputmode="decimal" step="any" aria-label="최저 점수" data-f="item" data-a="${ai}" data-i="${ii}" data-k="min" value="${esc(it.min)}"></div>

function mixHTML(g){

    <div class="mixbar">${g.areas.map((a,ai)=>{const m=areaMax(a);return `<span class="seg ${arc(ai)}" style="flex:${Math.max(m,tot*0.04)||1} 1 0" title="${esc(a.name)} ${m}점">${esc(a.name||'영역')}<em>${m}</em></span>`}).join('')}</div>`;
}
function chipsHTML(it){
  const r=scoreList(it);

  return `<span>입력할 수 있는 점수</span>`+r.list.map((v,i)=>`<span class="chip${i===0?' top':''}${v===0&&S.allowZero&&i===r.list.length-1?' zero':''}">${v}</span>`).join('')+`<span>· ${r.list.length}단계</span>`;
}
function refresh3(){
  if(ui.step!==3)return;const n=+ui.g,g=G(n);if(!g)return;
  g.areas.forEach((a,ai)=>{const t=$('atot-'+ai);if(t)t.textContent=areaMax(a);
    a.items.forEach((it,ii)=>{const c=$(`chips-${ai}-${ii}`);if(c)c.innerHTML=chipsHTML(it)})});

  on().forEach(x=>{const e=$('gtt-'+x);if(e)e.textContent=gradeMax(G(x))+'점'});

/* ---------- 4단계 ---------- */
function plan(n,c){
  const g=G(n);
  const areas=g.areas.map(a=>({name:a.name||'영역',max:areaMax(a),items:a.items.map(it=>({name:it.name||'항목',max:num(it.max),min:num(it.min),step:num(it.step),...scoreList(it)}))}));
  return {n,g,c,areas,kids:students(g,c),grand:gradeMax(g),sheetName:`${n}학년 ${c}반`,
    title:`${S.year}학년도 ${S.subject||''} 수행평가 점수표`.replace(/\s+/g,' '),
    sub:[S.school,`${n}학년 ${c}반`,S.teacher?`담당 ${S.teacher}`:''].filter(Boolean).join(' · ')};
}
function view4(){
  const list=on(),iss=issues();
  if(!list.length)return `<section class="panel">${ph(4,'확인하고 내려받기','먼저 학년을 골라 주세요.')}<div class="empty">2단계에서 학년을 골라야 시트가 만들어져요.<br><br><button type="button" class="btn" data-act="go" data-n="2">학년 고르러 가기</button></div></section>`;
  return `<section class="panel">

    <div class="sumrow"><span class="stat">엑셀 시트 <b>${sheetCount()}</b>개</span><span class="stat">학생 <b>${kidCount()}</b>명</span><span class="stat">파일 <b>1</b>개</span></div>
    <div class="gsum">${list.map(n=>{const g=G(n);return `<div class="gs gc${n}"><div class="gs-h"><b>${n}학년</b><span>${classes(g)}개 반 · ${g.areas.length}개 영역</span></div>
      <ul>${g.areas.map(a=>`<li><span>${esc(a.name||'영역')}</span><em>${areaMax(a)}</em></li>`).join('')}<li class="t"><span>총점</span><em>${gradeMax(g)}점</em></li></ul></div>`}).join('')}</div>
    ${iss.length?`<div class="issues"><b>⚠ 점수 범위를 확인해 주세요 (${iss.length}곳)</b><ul>${iss.map(x=>`<li>${esc(x.text)}</li>`).join('')}</ul>
      <div><button type="button" class="btn" data-act="fix" data-g="${iss[0].n}">평가 항목 고치러 가기</button></div></div>`:''}
    <div class="pv">
      <div class="pv-bar" id="ptabs"></div>
      <div class="sheet" id="sheet"></div>
    </div>
    <div class="dl">
      <button class="dl-btn" id="dlBtn" type="button" data-act="dl">엑셀 파일 내려받기<small id="dlName"></small></button>
      <p class="status" id="status" role="status">반마다 시트 하나씩, 모두 한 파일에 담겨요.</p>
    </div>
  </section>`;
}
function fileName(){return `${S.year}_${S.school||'학교'}_${S.subject||'교과'}_수행평가점수표.xlsx`.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'')}
function pseudo(a,b){let x=Math.sin(a*12.9898+b*78.233)*43758.5453;return x-Math.floor(x)}
function renderPreview(){
  if(ui.step!==4||!$('sheet'))return;
  const keys=[];on().forEach(n=>{for(let c=1;c<=classes(G(n));c++)keys.push(n+'-'+c)});
  if(!keys.includes(ui.pv))ui.pv=keys[0];
  $('ptabs').innerHTML=on().map(n=>`<div class="pg gc${n}"><span class="pg-l">${n}학년</span>${Array.from({length:classes(G(n))},(_,i)=>{const k=n+'-'+(i+1);
      return `<button type="button" class="ptab" data-act="pv" data-k="${k}" aria-selected="${k===ui.pv}">${i+1}반</button>`}).join('')}</div>`).join('')+
    `<label class="check"><input id="pv-sample" type="checkbox" ${ui.sample?'checked':''}> 예시 점수 넣어 보기</label>`;
  $('dlName').textContent=fileName();
  const [n,c]=ui.pv.split('-').map(Number);
  const P=plan(n,c),sample=ui.sample;
  let h1='<tr><th rowspan="3">번호</th><th rowspan="3">이름</th>',h2='<tr>',h3='<tr>';
  const colCls=[];
  P.areas.forEach((a,ai)=>{const k='ar '+arc(ai);h1+=`<th colspan="${a.items.length+1}" class="${k} top">${esc(a.name)}</th>`;
    a.items.forEach(it=>{colCls.push(k);h2+=`<th class="${k}">${esc(it.name)}</th>`;h3+=`<th class="${k}">${isFinite(it.max)?`${it.max}~${it.min} (${it.step})`:'—'}</th>`});
    colCls.push(k+' sum');h2+=`<th class="${k} sum">소계</th>`;h3+=`<th class="${k} sum">만점 ${a.max}</th>`});
  h1+='<th rowspan="2" class="total">총점</th></tr>';h2+='</tr>';h3+=`<th class="total">만점 ${P.grand}</th></tr>`;
  const colVals=[];let body='';
  P.kids.forEach((k,ri)=>{
    const absent=sample&&pseudo(ri+c,n+3)<.06;
    let row=`<tr><td class="num">${k.no}</td><td class="name${k.name?'':' ph'}">${k.name?esc(k.name):(sample?'학생'+k.no:'')}</td>`;let tot=0,any=false,ci=0;
    P.areas.forEach((a,ai)=>{let s=0,has=false;
      a.items.forEach((it,ii)=>{let v='';
        if(sample&&!absent&&it.list){const L=it.list.filter(x=>x>0||!S.allowZero);v=L[Math.floor(Math.pow(pseudo(ri+1,ai*7+ii+1),1.6)*L.length)]}
        if(v!==''){s+=v;has=true;(colVals[ci]=colVals[ci]||[]).push(v)}
        row+=`<td class="num ${colCls[ci]}">${v}</td>`;ci++});
      if(has){(colVals[ci]=colVals[ci]||[]).push(s);tot+=s;any=true}
      row+=`<td class="num ${colCls[ci]}">${has?r2(s):''}</td>`;ci++});
    if(any)(colVals[ci]=colVals[ci]||[]).push(tot);
    row+=`<td class="total num">${any?r2(tot):''}</td></tr>`;body+=row});
  const total=colCls.length+1;
  let foot='<tr><td colspan="2">평균</td>';
  for(let i=0;i<total;i++){const v=colVals[i];const avg=v&&v.length?(v.reduce((x,y)=>x+y,0)/v.length).toFixed(1):'';
    foot+=`<td class="${i===total-1?'total':colCls[i]}">${avg}</td>`}
  foot+='</tr>';
  $('sheet').innerHTML=`<div class="sheet-title">${esc(P.title)}</div><div class="sheet-sub">${esc(P.sub)}</div>
    <table class="x"><thead>${h1}${h2}${h3}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>
    <div class="sig">@yemusict</div>`;
}

/* ---------- 엑셀 ---------- */
function colL(n){let s='';while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s}
function buildWorkbook(){
  const wb=new ExcelJS.Workbook();wb.creator='@yemusict';wb.created=new Date();
  const thin={style:'thin',color:{argb:'FF8FA39A'}};
  const B={top:thin,left:thin,bottom:thin,right:thin};
  const F=argb=>({type:'pattern',pattern:'solid',fgColor:{argb}});
  const font={name:'맑은 고딕',size:10};
  on().forEach(n=>{for(let c=1;c<=classes(G(n));c++){
    const P=plan(n,c);
    const ws=wb.addWorksheet(P.sheetName,{properties:{tabColor:{argb:GTAB[n]}},
      views:[{state:'frozen',xSplit:2,ySplit:6}],
      pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true,
        margins:{left:.4,right:.4,top:.5,bottom:.5,header:.2,footer:.2},printTitlesRow:'4:6'}});
    ws.headerFooter.oddFooter='&8&K808080@yemusict&R&8&P / &N';
    const cols=[];let col=3;
    P.areas.forEach((a,ai)=>{const start=col;const items=a.items.map(it=>({it,col:col++}));cols.push({a,p:AP[ai%6],start,items,sum:col++})});
    const totCol=col,last=totCol;
    const colP={};cols.forEach(cg=>{cg.items.forEach(x=>colP[x.col]={p:cg.p,sum:false});colP[cg.sum]={p:cg.p,sum:true}});
    const R0=7,R1=R0+P.kids.length-1,AVG=R1+1;
    ws.getColumn(1).width=6;ws.getColumn(2).width=11;
    for(let i=3;i<=last;i++)ws.getColumn(i).width=10;
    ws.mergeCells(1,1,1,last);const t=ws.getCell(1,1);t.value=P.title;t.font={name:'맑은 고딕',size:15,bold:true};t.alignment={vertical:'middle'};ws.getRow(1).height=28;
    ws.mergeCells(2,1,2,last);const s=ws.getCell(2,1);s.value=P.sub;s.font={...font,color:{argb:'FF5D6C65'}};
    const hdr=(r,cl,v,opt={})=>{const cell=ws.getCell(r,cl);cell.value=v;cell.font={...font,bold:opt.bold!==false,size:opt.size||10,color:{argb:opt.color||'FF18241F'}};
      cell.alignment={horizontal:'center',vertical:'middle',wrapText:true};cell.fill=F(opt.fill||'FFE1EDE7');cell.border=B};
    ws.mergeCells(4,1,6,1);hdr(4,1,'번호');ws.mergeCells(4,2,6,2);hdr(4,2,'이름');
    cols.forEach(cg=>{
      if(cg.sum>cg.start)ws.mergeCells(4,cg.start,4,cg.sum);hdr(4,cg.start,cg.a.name,{size:11,fill:cg.p.sh});
      cg.items.forEach(x=>{hdr(5,x.col,x.it.name,{fill:cg.p.h});
        hdr(6,x.col,isFinite(x.it.max)?`${x.it.max}~${x.it.min}점\n(급간 ${x.it.step})`:'-',{bold:false,size:9,color:'FF5D6C65',fill:cg.p.h})});
      hdr(5,cg.sum,'소계',{fill:cg.p.sh});hdr(6,cg.sum,`만점 ${cg.a.max}`,{bold:false,size:9,fill:cg.p.sh});
      for(let cl=cg.start+1;cl<=cg.sum;cl++)ws.getCell(4,cl).fill=F(cg.p.sh);
    });
    ws.mergeCells(4,totCol,5,totCol);hdr(4,totCol,'총점',{fill:'FFFBE8E3',color:'FFC8412B',size:11});
    hdr(6,totCol,`만점 ${P.grand}`,{bold:false,size:9,fill:'FFFBE8E3',color:'FFC8412B'});
    for(let i=1;i<=last;i++)for(let r=4;r<=6;r++){const cell=ws.getCell(r,i);cell.border=B;if(!cell.fill)cell.fill=F('FFE1EDE7')}
    ws.getRow(4).height=22;ws.getRow(5).height=22;ws.getRow(6).height=30;
    const itemRefs=r=>cols.map(cg=>`${colL(cg.items[0].col)}${r}:${colL(cg.items[cg.items.length-1].col)}${r}`).join(',');
    P.kids.forEach((k,i)=>{const r=R0+i;
      ws.getCell(r,1).value=k.no;ws.getCell(r,2).value=k.name||null;
      cols.forEach(cg=>{
        cg.items.forEach(x=>{const cell=ws.getCell(r,x.col);cell.fill=F(cg.p.c);
          if(x.it.list){const csv=x.it.list.join(',');if(csv.length<250)cell.dataValidation={type:'list',allowBlank:true,formulae:[`"${csv}"`],
            showErrorMessage:true,errorStyle:'stop',errorTitle:'점수 확인',error:`${x.it.name}: ${x.it.list.join(', ')} 중에서 선택하세요.`,showInputMessage:false}}});
        const rg=`${colL(cg.items[0].col)}${r}:${colL(cg.items[cg.items.length-1].col)}${r}`;
        const sc=ws.getCell(r,cg.sum);sc.value={formula:`IF(COUNT(${rg})=0,"",SUM(${rg}))`};sc.fill=F(cg.p.s);sc.font={...font,bold:true}});
      const tc=ws.getCell(r,totCol);const refs=itemRefs(r);
      tc.value={formula:`IF(COUNT(${refs})=0,"",SUM(${refs}))`};tc.fill=F('FFFDF3F0');tc.font={...font,bold:true,color:{argb:'FFC8412B'}};
      for(let cl=1;cl<=last;cl++){const cell=ws.getCell(r,cl);cell.border=B;if(!cell.font||!cell.font.bold)cell.font=font;
        cell.alignment={horizontal:cl===2?'left':'center',vertical:'middle'}}
      if(i%5===4)for(let cl=1;cl<=last;cl++)ws.getCell(r,cl).border={...B,bottom:{style:'thin',color:{argb:'FF245C49'}}};
    });
    ws.mergeCells(AVG,1,AVG,2);ws.getCell(AVG,1).value='평균';
    for(let cl=3;cl<=last;cl++){const L=colL(cl);ws.getCell(AVG,cl).value={formula:`IFERROR(AVERAGE(${L}${R0}:${L}${R1}),"")`}}
    for(let cl=1;cl<=last;cl++){const cell=ws.getCell(AVG,cl);cell.border={...B,top:{style:'medium',color:{argb:'FF245C49'}}};
      cell.fill=F(cl===totCol?'FFFBE8E3':colP[cl]?(colP[cl].sum?colP[cl].p.sh:colP[cl].p.h):'FFE1EDE7');
      cell.font={...font,bold:true,color:{argb:cl===totCol?'FFC8412B':'FF18241F'}};
      cell.alignment={horizontal:'center',vertical:'middle'};if(cl>2)cell.numFmt='0.0'}
    ws.getRow(AVG).height=20;
    const sg=ws.getCell(AVG+2,1);sg.value='@yemusict';sg.font={name:'맑은 고딕',size:8,color:{argb:'FF9AABA3'}};
  }});
  return wb;
}

/* ---------- 내려받기 ---------- */
let dlP=null;
function getDownloads(){if(!dlP)dlP=(window.claude&&typeof window.claude.use==='function')?window.claude.use('downloads').catch(()=>null):Promise.resolve(undefined);return dlP}
getDownloads();
function setStatus(t,cls){const s=$('status');if(!s)return;s.textContent=t;s.className='status'+(cls?' '+cls:'')}
async function download(){
  if(typeof ExcelJS==='undefined'){setStatus('엑셀 도구를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.','bad');return}
  const btn=$('dlBtn');btn.disabled=true;setStatus('파일을 만드는 중…');
  try{
    const wb=buildWorkbook();const buf=await wb.xlsx.writeBuffer();
    const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const fname=fileName(),sheets=wb.worksheets.length;
    const dl=await getDownloads();
    if(dl===undefined){ // 일반 웹페이지(GitHub 등)
      const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);setStatus(`저장했어요 · ${fname} · 시트 ${sheets}개`,'ok');
    }else if(dl===null){setStatus('이 화면에서는 파일 저장을 쓸 수 없어요. 웹앱 링크를 브라우저에서 다시 열어 주세요.','bad');
    }else{
      try{await dl.save({filename:fname,data:blob});setStatus(`저장했어요 · ${fname} · 시트 ${sheets}개`,'ok')}
      catch(e){const code=e&&e.code;
        setStatus(code==='declined'?'저장을 취소했어요. 다시 누르면 언제든 받을 수 있어요.':code==='rate_limited'?'저장 창이 이미 열려 있어요. 잠시 뒤 다시 눌러 주세요.':'이 화면에서는 파일 저장을 쓸 수 없어요.','bad')}
    }
  }catch(e){setStatus('파일을 만들다 문제가 생겼어요: '+(e&&e.message||e),'bad')}
  finally{btn.disabled=false}
}

/* ---------- 되돌리기 알림 ---------- */
let undoFn=null,toastT;
function toast(msg,undo){
  const el=$('toast');undoFn=undo||null;
  el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button type="button" data-act="undo">되돌리기</button>':''}`;
  el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;undoFn=null},6000);
}
function undoable(msg,fn){const snap=JSON.stringify(S);fn();save();render();toast(msg,()=>{S=JSON.parse(snap);save();render()})}

/* ---------- 화면 그리기 ---------- */
function render(scroll){
  const v=[view1,view2,view3,view4][ui.step-1]();
  $('view').innerHTML=v;
  if(ui.step===1)refresh1();
  if(ui.step===4)renderPreview();
  renderStepper();renderNav();save();
  if(scroll)window.scrollTo({top:0,behavior:'auto'});
}
function go(n){ui.step=Math.min(4,Math.max(1,n));ui.open=null;render(true)}
function focusSel(id){const e=$(id);if(e){e.focus();if(e.select)e.select()}}

document.addEventListener('input',e=>{
  const el=e.target,f=el.dataset.f;
  if(el.id==='pv-sample'){ui.sample=el.checked;renderPreview();save();return}
  if(!f)return;
  if(f==='base'){S[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;refresh1();if(el.dataset.k==='allowZero')refresh3()}
  else if(f==='gnum'){G(el.dataset.g)[el.dataset.k]=el.value;const s=$('gsheets-'+el.dataset.g);if(s)s.textContent=classes(G(el.dataset.g))+'개'}
  else if(f==='roster'){const g=G(el.dataset.g),c=el.dataset.c;g.rosters=g.rosters||{};g.rosters[c]=el.value;
    const ch=$(`cls-${el.dataset.g}-${c}`);if(ch){ch.textContent=chipText(g,c);ch.parentElement.classList.toggle('has',parseRoster(el.value).length>0)}
    const rc=$(`rcount-${el.dataset.g}-${c}`);if(rc){rc.textContent=rcount(g,c);rc.classList.toggle('none',!parseRoster(el.value).length)}}
  else if(f==='area'){G(ui.g).areas[+el.dataset.a].name=el.value;refresh3()}
  else if(f==='item'){G(ui.g).areas[+el.dataset.a].items[+el.dataset.i][el.dataset.k]=el.value;refresh3()}
  save();renderStepper();
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.f==='gnum'){const g=G(el.dataset.g);g.classes=classes(g);g.students=intIn(g.students,1,60,25);render()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,n=+b.dataset.g,a=+b.dataset.a,i=+b.dataset.i;
  switch(act){
    case 'go':go(+b.dataset.n);break;
    case 'prev':go(ui.step-1);break;
    case 'next':go(ui.step+1);break;
    case 'tog':{const g=G(n);g.on=!g.on;if(g.on)ui.g=n;if(ui.open&&ui.open.startsWith(n+'-'))ui.open=null;render();
      if(!g.on)toast(`${n}학년을 뺐어요. 다시 누르면 설정이 그대로 돌아와요.`);break}
    case 'inc':{const g=G(n),k=b.dataset.k,d=+b.dataset.d;
      if(k==='classes')g.classes=Math.min(20,Math.max(1,classes(g)+d));else g.students=Math.min(60,Math.max(1,intIn(g.students,1,60,25)+d));
      render();focusSel(`g${n}-${k}`);break}
    case 'openRoster':{const k=n+'-'+b.dataset.c;ui.open=(ui.open===k&&b.classList.contains('cchip'))?null:k;render();if(ui.open)$('roster-'+ui.open)?.focus();break}
    case 'closeRoster':ui.open=null;render();break;
    case 'clearRoster':{const c=b.dataset.c;undoable(`${n}학년 ${c}반 명렬을 비웠어요.`,()=>{delete G(n).rosters[c]});break}
    case 'gtab':ui.g=n;render();break;
    case 'addArea':{const g=G(ui.g);g.areas.push({name:'',items:[{name:'',max:10,min:2,step:2}]});render();focusSel(`a-${ui.g}-${g.areas.length-1}`);break}
    case 'delArea':{const g=G(ui.g),nm=g.areas[a].name||`영역 ${a+1}`;undoable(`'${nm}' 영역을 지웠어요.`,()=>{g.areas.splice(a,1);if(!g.areas.length)g.areas=STARTER()});break}
    case 'addItem':{const g=G(ui.g);g.areas[a].items.push({name:'',max:10,min:2,step:2});render();focusSel(`i-${ui.g}-${a}-${g.areas[a].items.length-1}-name`);break}
    case 'delItem':{const g=G(ui.g);if(g.areas[a].items.length>1){const nm=g.areas[a].items[i].name||'세부항목';undoable(`'${nm}' 항목을 지웠어요.`,()=>g.areas[a].items.splice(i,1))}break}
    case 'copyAreas':{const from=+$('copyFrom').value,to=+ui.g;undoable(`${from}학년 평가를 ${to}학년에 복사했어요.`,()=>{G(to).areas=JSON.parse(JSON.stringify(G(from).areas))});break}
    case 'fix':ui.g=n;go(3);break;
    case 'pv':ui.pv=b.dataset.k;renderPreview();save();break;
    case 'dl':download();break;
    case 'reset':{undoable('예시 설정으로 처음부터 다시 시작해요.',()=>{S=defaults();ui.step=1;ui.g=1;ui.open=null;ui.pv=null});window.scrollTo(0,0);break}
    case 'undo':{const f=undoFn;$('toast').hidden=true;undoFn=null;if(f)f();break}
  }
});
render();
})();
</script>

</body>
</html>
